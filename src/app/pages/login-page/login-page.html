<section class="login-page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>StayAdmin bejelentkezés</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <mat-form-field appearance="outline">
          <mat-label>Felhasználónév</mat-label>
          <input matInput type="text" formControlName="username" autocomplete="username" />
          @if (loginForm.controls.username.touched && loginForm.controls.username.hasError('required')) {
            <mat-error>Add meg a felhasználónevet.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Jelszó</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (loginForm.controls.password.touched && loginForm.controls.password.hasError('required')) {
            <mat-error>Add meg a jelszót.</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Bejelentkezés...' : 'Bejelentkezés' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</section>
